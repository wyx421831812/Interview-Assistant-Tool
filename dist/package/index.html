<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>面伴 · AI 面试辅助工具</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%233b6fe0'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'%3E面%3C/text%3E%3C/svg%3E" />
  <style>
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --border: #e6e8ec;
  --text: #22262b;
  --text-2: #6b7280;
  --accent: #3b6fe0;
  --accent-weak: #eaf0fc;
  --danger: #d5484d;
  --ok: #2f9e6e;
  --warn: #c9871c;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(20, 30, 50, .08);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
}

.app { display: flex; height: 100vh; overflow: hidden; }

/* ---------- 侧边栏 ---------- */
.sidebar {
  width: 220px; flex: 0 0 220px;
  background: #1d2330; color: #dbe1ec;
  display: flex; flex-direction: column;
}
.brand { padding: 20px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand-logo { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 1px; }
.brand-sub { display: block; font-size: 12px; color: #8b95a7; margin-top: 2px; }
.nav { padding: 12px 10px; flex: 1; overflow: auto; }
.nav-item {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; margin: 2px 0;
  border: none; border-radius: 8px; background: transparent;
  color: #c6cddb; font-size: 14px; cursor: pointer; text-align: left;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active { background: var(--accent); color: #fff; }
.nav-icon { width: 18px; text-align: center; }
.sidebar-footer {
  padding: 12px 18px; border-top: 1px solid rgba(255,255,255,.08);
  font-size: 12px; color: #8b95a7; display: flex; align-items: center; gap: 8px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: #a0a6b3; display: inline-block; }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--danger); }

/* ---------- 主内容 ---------- */
.content { flex: 1; overflow: auto; padding: 24px 28px; }
.view { max-width: 1080px; margin: 0 auto; animation: fadein .18s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

.view-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
.view-title { font-size: 22px; font-weight: 700; margin: 0; }
.view-desc { color: var(--text-2); margin-top: 4px; font-size: 13px; }

.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px; margin-bottom: 16px;
}
.card-title { font-size: 15px; font-weight: 600; margin: 0 0 12px; }

/* ---------- 按钮/输入 ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: #fff; color: var(--text); font-size: 14px; cursor: pointer;
  transition: all .12s; user-select: none;
}
.btn:hover { border-color: #c9cdd4; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #2f5fd0; }
.btn.danger { color: var(--danger); border-color: #f0cacb; background: #fff7f7; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.input, .textarea, .select {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; color: var(--text);
}
.input:focus, .textarea:focus, .select:focus { outline: none; border-color: var(--accent); }
.textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
.label { display: block; font-size: 13px; color: var(--text-2); margin: 12px 0 5px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* ---------- 表单/标记 ---------- */
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  background: var(--accent-weak); color: var(--accent);
  padding: 3px 9px; border-radius: 20px; font-size: 12px;
}
.tag.remove { cursor: pointer; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 14px; font-size: 11px; }
.badge.hi { background: #fdeaea; color: var(--danger); }
.badge.mid { background: #fdf3e0; color: var(--warn); }
.badge.lo { background: #e9f6ef; color: var(--ok); }
.badge.tech { background: #eaf0fc; color: var(--accent); }
.badge.proj { background: #f0eaff; color: #6a3fd8; }
.badge.beh { background: #e9f6ef; color: var(--ok); }

/* ---------- 列表 ---------- */
.list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 4px; border-bottom: 1px solid var(--border); gap: 12px;
}
.list-item:last-child { border-bottom: none; }
.item-main { flex: 1; min-width: 0; }
.item-title { font-weight: 600; }
.item-sub { color: var(--text-2); font-size: 13px; margin-top: 2px; }
.item-actions { display: flex; gap: 6px; flex: 0 0 auto; }

/* ---------- 网格统计 ---------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.stat-value { font-size: 26px; font-weight: 700; }
.stat-label { color: var(--text-2); font-size: 13px; margin-top: 2px; }

/* ---------- 聊天区 ---------- */
.chat { display: flex; flex-direction: column; gap: 12px; max-height: 460px; overflow: auto; padding: 4px; }
.msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg.assistant { align-self: flex-start; background: var(--accent-weak); border-top-left-radius: 4px; }
.msg.user { align-self: flex-end; background: #1d2330; color: #fff; border-top-right-radius: 4px; }
.msg .mtime { display: block; font-size: 11px; color: var(--text-2); margin-top: 4px; }
.msg.user .mtime { color: #a9b2c4; }

.login-prompt, .empty-box {
  text-align: center; color: var(--text-2); padding: 40px 10px;
}
.empty-box .em { font-size: 34px; display: block; margin-bottom: 8px; }

/* ---------- 回复示范 ---------- */
.review-block { background: #f7faf7; border: 1px solid #dceadf; border-radius: 8px; padding: 12px; margin-top: 12px; }
.review-block .rb-title { font-weight: 600; color: var(--ok); margin-bottom: 6px; }

/* ---------- 评分条 ---------- */
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
.score-item { background: var(--bg); border-radius: 8px; padding: 10px; }
.score-item .sk { font-size: 12px; color: var(--text-2); }
.score-item .sv { font-size: 18px; font-weight: 700; }
.bar { height: 6px; background: #e6e8ec; border-radius: 3px; margin-top: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* ---------- 雷达图/趋势 ---------- */
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 820px) { .chart-row { grid-template-columns: 1fr; } }
.chart-box { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.chart-box .cb-title { font-weight: 600; margin-bottom: 10px; }
canvas { width: 100%; height: auto; display: block; }

/* ---------- 模态/弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(15,20,30,.45);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
}
.modal-mask[hidden] { display: none; }
.modal { background: #fff; border-radius: 12px; padding: 22px; width: 420px; max-width: 92vw; box-shadow: 0 12px 40px rgba(0,0,0,.2); }
.modal-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.modal-body { color: var(--text-2); margin-bottom: 16px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

.toast-wrap { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: #1d2330; color: #fff; padding: 8px 16px; border-radius: 8px;
  font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.2); animation: fadein .2s ease;
}
.toast.err { background: var(--danger); }
.toast.ok { background: var(--ok); }

.mono { font-family: var(--mono); font-size: 13px; background: var(--bg); padding: 10px 12px; border-radius: 8px; overflow: auto; }

.hint { font-size: 12px; color: var(--text-2); margin-top: 4px; }
.spinner {
  width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.divider { height: 1px; background: var(--border); margin: 14px 0; }
</style>
</head>
<body>
  <div id="app" class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">面伴</span>
        <span class="brand-sub">AI 面试辅助</span>
      </div>
      <nav class="nav">
        <button class="nav-item" data-view="dashboard">
          <span class="nav-icon">▦</span>总览
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-icon">⚙</span>设置
        </button>
        <button class="nav-item" data-view="profile">
          <span class="nav-icon">▣</span>简历画像
        </button>
        <button class="nav-item" data-view="resume-optimize">
          <span class="nav-icon">✎</span>简历优化
        </button>
        <button class="nav-item" data-view="notes">
          <span class="nav-icon">☰</span>笔记知识库
        </button>
        <button class="nav-item" data-view="interview">
          <span class="nav-icon">◉</span>模拟面试
        </button>
        <button class="nav-item" data-view="review">
          <span class="nav-icon">✪</span>面试复盘
        </button>
        <button class="nav-item" data-view="prediction">
          <span class="nav-icon">◎</span>高频题预测
        </button>
      </nav>
      <div class="sidebar-footer">
        <span class="dot" id="cfg-dot"></span>
        <span id="cfg-status">未配置</span>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="content" id="content">
      <div class="placeholder">加载中…</div>
    </main>
  </div>

  <!-- 轻提示 -->
  <div class="toast-wrap" id="toast-wrap"></div>

  <!-- 确认弹窗 -->
  <div class="modal-mask" id="confirm-mask" hidden>
    <div class="modal">
      <div class="modal-title" id="confirm-title">确认</div>
      <div class="modal-body" id="confirm-body"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="confirm-cancel">取消</button>
        <button class="btn primary" id="confirm-ok">确定</button>
      </div>
    </div>
  </div>
